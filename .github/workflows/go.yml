name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Check formatting
      run: |
        fmt_out="$(gofmt -l .)"
        if [ -n "$fmt_out" ]; then
          echo "The following files are not gofmt'd:"
          echo "$fmt_out"
          exit 1
        fi

    - name: Test
      run: go test -v ./...
